<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Отчётник</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">🔹</span>
        <span class="brand__name">Отчётник</span>
        <span class="brand__sub">UX Writers</span>
      </div>
      <nav class="tabs" id="tabs" aria-label="Разделы" hidden></nav>
      <div class="account" id="account" hidden>
        <span class="account__name" id="accountName"></span>
        <span class="role-badge" id="accountRole"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="logoutBtn">Выйти</button>
      </div>
    </div>
  </header>

  <main class="page" id="app" aria-live="polite">
    <p class="muted">Загрузка…</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
